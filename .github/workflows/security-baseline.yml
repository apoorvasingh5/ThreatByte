name: Security baseline

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  security-baseline:
    uses: cx-kedar-bhujade/prbot/.github/workflows/security-baseline.yml@AST-188217-report-ui-refresh
    permissions:
      contents: read
      id-token: write
      actions: write
    with:
      bot-repository: cx-kedar-bhujade/prbot
      bot-ref: AST-188217-report-ui-refresh
      provider: gemini
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
